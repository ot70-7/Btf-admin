    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>BTF 管理员</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app">
      <span class="brand"><img src="./assets/logo.png" alt="BTF" width="22" height="22" /> 管理员</span>
      <span class="spacer"></span>
      <button class="btn btn--small" id="connect" type="button">连接钱包</button>
    </header>

    <main>
      <p class="status" id="status">仅管理员可用。请连接带有管理凭证的钱包。</p>

      <section class="card" id="gate">
        <h2>仅限项目方管理员</h2>
        <p class="small muted">
          管理员身份有两种来源：仓库配置的地址名单，或持有「管理凭证」代币。都没有则无法进入。
        </p>
        <button class="btn" id="gate-connect" type="button">连接管理员钱包</button>
        <p class="status" id="gate-status"></p>
      </section>

      <div id="admin-area" class="hide">
        <section class="card stack">
          <h2>当前管理员</h2>
          <dl class="kv" id="admin-summary"></dl>
          <div class="table-wrap">
            <table>
              <thead><tr><th>地址</th><th>凭证</th></tr></thead>
              <tbody id="admin-rows"></tbody>
            </table>
          </div>
          <button class="btn btn--ghost btn--small" id="refresh" type="button">刷新</button>
        </section>

        <section class="card stack hide" id="init-card">
          <h2>初始化管理凭证</h2>
          <p class="small muted">
            创建一个 0 位小数、总量 10 枚的凭证代币。持有 1 枚即视为管理员，之后可以把它转给新的管理员。
          </p>
          <button class="btn" id="init-pass" type="button">创建管理凭证</button>
        </section>

        <section class="card stack" id="add-card">
          <h2>添加管理员</h2>
          <label class="field">
            新管理员钱包地址
            <input id="new-admin" placeholder="粘贴 Solana 地址" />
          </label>
          <button class="btn" id="add-admin" type="button">转 1 枚凭证给他</button>
          <p class="small muted">
            对方需要自己签名接收吗？不需要：你转出即可生效。撤回权限需要他把凭证转回你的地址。
          </p>
        </section>
      </div>
    </main>

    <div id="toasts"></div>
