    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>BTF 批量发放</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app">
      <span class="brand"><img src="./assets/logo.png" alt="BTF" width="22" height="22" /> 批量发放</span>
      <span class="spacer"></span>
      <button class="btn btn--small" id="connect" type="button">连接钱包</button>
    </header>

    <main>
      <p class="status" id="status">仅管理员可用。先连接管理员钱包。</p>

      <section class="card" id="gate">
        <h2>仅限项目方管理员</h2>
        <p class="small muted">批量发放会动用主钱包余额，仅管理员钱包可用。</p>
        <button class="btn" id="gate-connect" type="button">连接管理员钱包</button>
        <p class="status" id="gate-status"></p>
      </section>

      <div id="admin-area" class="hide">
        <section class="card stack">
          <h2>1. 读取持仓</h2>
          <p class="small muted">
            直接读链上代币账户，按持有人聚合。地址多时需要支持 getProgramAccounts 的 RPC。
          </p>
          <button class="btn btn--ghost" id="load-holders" type="button">读取全部持仓地址</button>
          <details class="small muted">
            <summary>RPC 不支持时：手动粘贴名单</summary>
            <div class="stack" style="margin-top: 8px">
              <textarea id="manual-list" rows="4" placeholder="每行：地址,数量&#10;例如：&#10;FW7z…thgs,1000&#10;9xQe…3nVb,250"></textarea>
              <button class="btn btn--ghost btn--small" id="load-manual" type="button">使用手动名单</button>
            </div>
          </details>
          <p class="small muted" id="holders-summary"></p>
        </section>

        <section class="card stack">
          <h2>2. 筛选与方案</h2>
          <label class="field">
            最低持仓门槛（BTF，留空表示不限制）
            <input id="threshold" inputmode="decimal" placeholder="例如 1000" />
          </label>
          <label class="field">
            排除地址（每行一个，主钱包已自动排除）
            <textarea id="exclude" rows="2" placeholder="可选"></textarea>
          </label>
          <label class="field">
            发放方式
            <select id="mode">
              <option value="equal">等额：名单内每人相同</option>
              <option value="proportional">按持仓比例</option>
              <option value="fixed">固定每人数量</option>
            </select>
          </label>
          <label class="field" id="budget-field">
            发放总量（BTF）
            <input id="budget" inputmode="decimal" placeholder="例如 100000" />
          </label>
          <label class="field hide" id="per-wallet-field">
            每人数量（BTF）
            <input id="per-wallet" inputmode="decimal" placeholder="例如 100" />
          </label>
          <label class="row small muted" style="gap: 8px">
            <input type="checkbox" id="create-atas" style="width: auto" />
            为没有代币账户的地址创建账户（每个约 0.00204 SOL）
          </label>
          <button class="btn" id="plan" type="button">生成方案与成本</button>
        </section>

        <section class="card stack">
          <h2>3. 预览</h2>
          <dl class="kv" id="plan-summary"></dl>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>地址</th><th>持仓</th><th>发放</th></tr>
              </thead>
              <tbody id="plan-rows"></tbody>
            </table>
          </div>
          <button class="btn btn--ghost btn--small" id="export" type="button">导出 CSV</button>
        </section>

        <section class="card stack">
          <h2>4. 执行</h2>
          <p class="small muted">
            每批 10 个地址，每批需要你在钱包里签名一次。中途可停止，已完成批次不会重复。
          </p>
          <button class="btn btn--danger" id="run" type="button" disabled>开始发放</button>
          <div class="positions" id="progress"></div>
        </section>
      </div>
    </main>

    <div id="toasts"></div>

    <nav class="bottom">

  </body>
</html>
